# Intake and normalisation of a CT lesion only; no analysis and no report. Offered as
# unavailable (`no_implementation`, slot `normalisation`) in a deployment that leaves the
# normalisation slot unmounted.
contract_version: "1.2"
kind: Preset
id: ct-normalisation
version: 1.6.0
title: Normalisation of a CT lesion to MNI152
description: >-
  Lesion intake and QC and registration of the CT and its lesion mask to MNI152, without
  further analysis.
pipeline:
  id: stroke-lnm
  versions: ">=0.2.0, <0.9.0"
input_sets: [ct-and-native-mask]
targets:
  required: [lesion-intake, normalisation]
