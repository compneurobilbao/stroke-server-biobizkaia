# Minimum pipeline: lesion mask already in MNI space -> lesion intake and QC -> functional
# disconnection -> COGNET-STROKE cognitive profile, and tract-wise disconnection -> research report
# (owner decision 4 of ADR-0018: the report is part of this preset). Unlike `full`, every analysis
# is required: a deployment without an enabled implementation refuses the run instead of silently
# running without it. Lesion intake and QC is not named: it is reached upstream of the others
# (the report consumes `lesion_qc`).
contract_version: "1.2"
kind: Preset
id: mni-mask-analysis
version: 1.5.0
title: Disconnection analysis of an MNI lesion mask
description: >-
  Lesion QC, functional disconnection with the COGNET-STROKE cognitive profile, tract-wise
  disconnection and the research report for a lesion mask already in MNI space.
pipeline:
  id: stroke-lnm
  versions: ">=0.2.0, <0.8.0"
input_sets: [mni-mask]
targets:
  required: [tract-disconnection, functional-disconnection, cognet-profile, report]
