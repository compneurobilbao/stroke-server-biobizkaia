# Registry of the implementations of the stroke-lnm slots and the profiles that say which of
# them are enabled (D15, docs/contracts/pipeline.md section 7). It mirrors pipeline.yaml
# (`python pipelines/stroke-lnm/registry.py check` keeps the two in step) and adds what the
# pipeline file does not carry: where each step comes from, whether it is real, a stub or
# not available yet, and what a deployment or the CI mounts.
#
# Image digests are those of the published step images (`published: true`). The release
# workflow (.github/workflows/release-steps.yml, `release.py`) builds, tests and pushes them to
# docker.io/compneurobilbaolab/step-<name>:<step version>; `registry.py pin` writes the
# published digests here and into pipeline.yaml and sets `published: true`, after which
# `registry.py check` requires real digests for everything the `deployment` profile enables
# (build: local entries excepted). A new step version starts with placeholder digests (64 zeros)
# until it is released and pinned. CI builds the steps into a throwaway registry and writes
# those digests at run time (`registry.py materialize`) without touching this file. Nothing
# is ever pulled while a digest is a placeholder.
registry_version: 1
pipeline: {id: stroke-lnm, version: 0.10.0}
# false while lnm-tracts 1.1.0 waits for its release: release-steps publishes it, then
# `registry.py pin` writes its digest and sets this back to true.
published: true

# kind: real     a merged step that runs on real data
#       stub     synthetic output, only enabled in the ci profile (and demo deployments)
#       planned  no merged code: defined by the pipeline, never mounted
#
# Optional fields (card F1-23, docs/design/run-plans.md 4.2 to 4.4; `registry.py check`):
#   origin: internal|external   default internal. An external entry wraps a third-party tool:
#                               its manifest declares contract 1.2 and the `upstream` block, its
#                               Dockerfile pins the upstream image by digest, and the entry needs
#                               licence_review and validation.
#   licence_review: {status: reviewed|pending, code, weights, image_redistribution:
#                    allowed|forbidden, notes, reviewed: <date>, reviewed_by}
#                               `pending`: not yet confirmed (no `reviewed`, no `reviewed_by`);
#                               `reviewed` needs both. `reviewed_by` is the responsible person,
#                               not the wrapper author.
#   validation: {status: unvalidated|reference-tested|validated, record: <repository file>,
#                reviewed_by, notes}
#                               Every real implementation needs an explicit status; nothing is
#                               validated implicitly. `validated` needs a record (a document in
#                               the repository, no data) and `reviewed_by`. Stubs and planned
#                               entries are unvalidated.
#   build: published|local      `local` (never pushed or built by CI, never a public-registry image): the licence forbids publishing an image containing the
#                               tool; each deployment builds the wrapper itself and the image is
#                               never pushed to the public registry (owner decision 7).
#   title: <text>               optional display title of the entry (the UI and the API show it instead of
#                               the step manifest's title; the frontend catalogue may translate it by
#                               implementation id). It lives here, not in pipeline.yaml, because the
#                               pipeline schema (contract 1.2) has no title on implementation entries.
# A deployment does not enable, and its runs do not use, an implementation below its minimum
# validation level (MIN_IMPLEMENTATION_VALIDATION, docs/configuration.md); the `deployment`
# profile here enables nothing below reference-tested. No step is `validated` until a validation
# record is signed off by the responsible scientist, so the public profiles (minimum validated)
# enable nothing yet and the lab instance runs as DEPLOYMENT_PROFILE=on-premise.
implementations:
  lesion-intake:
    lesion-qc:
      step: {name: lesion-qc, version: 1.0.0}
      kind: real
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data. No signed validation record exists, so it is not validated.
      image: docker.io/compneurobilbaolab/step-lesion-qc@sha256:c23607186e6c771164ca6f0b8dcdd0509ec895344602cb60d9c4b0d841dcaf32
      source: {repository: this, dockerfile: steps/lesion-qc/Dockerfile}
  normalisation:
    ct-lesion-to-mni152:
      step: {name: ct-lesion-to-mni152, version: 1.0.1}
      kind: real
      licence_review:
        status: reviewed
        code: MIT
        weights: No model weights; the image contains the registration templates of the step.
        image_redistribution: allowed
        notes: >-
          The image contains FSL (flirt, fslmaths, cluster), whose licence is non-commercial for
          the general public. The platform is non-commercial research software, and the project
          owner accepts publishing this image on the public registry under that condition; anyone
          who uses the image for commercial purposes needs their own FSL licence. The licence
          text of the third-party components is listed in the step manifest (licence.third_party).
        reviewed: "2026-11-23"
        reviewed_by: project owner
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data. No signed validation record exists, so it is not validated. Known limitation: the step's regression floor on its reference case is Dice 0.40.
      image: docker.io/compneurobilbaolab/step-ct-lesion-to-mni152@sha256:717b4ab02c9d8fab0f1ccf4de16d3a764b17960b9525b9fc418e2485ceb86b1d
      # Wrapper of this repository; the author's package is installed unmodified from the
      # upstream commit (steps/ct-lesion-to-mni152/upstream.env, kept equal by `check`).
      source:
        repository: this
        dockerfile: steps/ct-lesion-to-mni152/Dockerfile
        upstream: {repository: compneurobilbao/CTLesion2MNI152, commit: 07702382b588f430b52005b61e71a9b48f5fcd15}
  functional-disconnection:
    # The same step image three times (pipeline.yaml pins a different normative-fc bundle in
    # each entry, which is the whole difference): the HCP Aging cohort, the HCP Young Adult
    # cohort, and a synthetic cohort that only the ci profile enables. The two cohort entries
    # need their real bundle installed on the deployment (docs/reference-data.md); the entries
    # after the first reuse its fields through the YAML anchor.
    flnm-fast-hcp-aging: &flnm_fast
      title: flnm-fast · HCP Aging
      step: {name: flnm-fast, version: 3.0.0}
      kind: real
      origin: external
      licence_review:
        status: pending  # to be confirmed by the image author; then `reviewed` and `reviewed_by`
        code: MIT
        weights: >-
          No model weights. The normative functional connectivity data is a reference bundle
          (type normative-fc, docs/reference-data.md) whose cohort terms apply; real cohort
          data is not redistributable and is installed locally, never in the image.
        image_redistribution: allowed
        notes: >-
          Licence taken from the declaration of the wrapped engine image (MIT, recorded in
          the step manifest; the image label of 2.1.0 still says MIT, no licence file or
          source repository is available to confirm it against), so the image author should
          still confirm it. Engine updated from 1.0 to 2.1.0 (step 2.0.0). Engine 1.0 dropped the
          lowest-numbered lesion-overlapped parcel from the weighting; engine 2.1.0 does not (checked
          on the code and with a synthetic test), so the workaround of step 1.x (warning
          lowest_overlapped_parcel_omitted, refusal lesion_single_parcel) was removed. Results of
          step 2.0.0 therefore differ from those of 1.x for every lesion that overlaps more than
          one parcel. Step 3.0.0 runs the engine without age and sex matching, over every
          participant of the pinned cohort bundle. Known property of 2.1.0, not changed: a target
          parcel with constant (not missing) connectivity across the controls gets a very large
          finite z instead of NaN, because of rounding in the engine's regression; parcels with
          missing values are NaN.
      validation:
        status: reference-tested
        notes: >-
          The reference test of the step (synthetic normative cohort, expected map computed
          independently of the engine) passes in CI for this image (engine 2.1.0). No agreement
          with reference results on lab reference cases has been recorded, so it is not
          validated, and the step is a new major version (3.x) with no field history. Cohort
          bundle of this entry: normative-fc-hcp-aging 1.0.0 (HCP Aging); the normative choice
          is the cohort only, there is no age or sex matching.
      image: docker.io/compneurobilbaolab/step-flnm-fast@sha256:368df2c450b30f02d43d30bdf8ec9750bcf43f6b208731dde64d30bbf3c5efb0
      source:
        repository: this
        dockerfile: steps/flnm-fast/Dockerfile
        note: "wrapper over the public engine image compneurobilbaolab/flnm-fast (digest pinned in the Dockerfile; no source repository)"
    flnm-fast-hcp-ya:
      <<: *flnm_fast
      title: flnm-fast · HCP Young Adult
      validation:
        status: reference-tested
        notes: >-
          As flnm-fast-hcp-aging. Cohort bundle of this entry: normative-fc-hcp-ya 1.0.0 (HCP
          Young Adult).
    flnm-fast-synthetic:
      <<: *flnm_fast
      title: flnm-fast · synthetic cohort (CI)
      validation:
        status: reference-tested
        notes: >-
          CI fixture: the real step on the synthetic bundle synthetic-normative-fc 1.0.0
          (27 block parcels). Enabled in the ci profile only; its z-maps have no scientific
          meaning.
    fdisconnection-stub:
      step: {name: fdisconnection-stub, version: 0.1.0}
      kind: stub
      image: docker.io/compneurobilbaolab/step-fdisconnection-stub@sha256:8da4c433c7c9f6cf0dc9f59536d40f310fc8f09ff0d0c2dd28715a5e70c55745
      source: {repository: this, dockerfile: steps/stubs/fdisconnection-stub/Dockerfile}
  tract-disconnection:
    # lnm-tracts 1.1.0 (cards STEPS-02, TRACTS-01): when the tract atlas declares a space other
    # than the lesion's (bundle metadata `space`), the lesion is resampled into it (nearest
    # neighbour) with the optional space-transform bundle before tract disconnection; an atlas
    # without `space` is used as in 1.0.x.
    lnm-tracts: &lnm_tracts
      title: lnm-tracts · registered tract atlas
      step: {name: lnm-tracts, version: 1.1.0}
      kind: real
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data, including the
          atlas-space resampling with synthetic identity and shift transforms. No signed
          validation record exists, so it is not validated.
      image: docker.io/compneurobilbaolab/step-lnm-tracts@sha256:626754f10150ea63382e48aa481ad784ec789530160135821d854a3639a28941
      # A port in this repository of the author's src/lnm_tracts.sh: the released image contains
      # no code of the lnm repository. `upstream` names the commit whose unmodified script CI runs
      # for the comparison only (Dockerfile target `legacy`, never released;
      # steps/lnm-tracts/upstream.env).
      source:
        repository: this
        dockerfile: steps/lnm-tracts/Dockerfile
        upstream: {repository: compneurobilbao/lnm, commit: 123f3298b23dafa02a67b6f096790cfe3b775fb2}
    # The same step image, pinned in pipeline.yaml to the HCP1065 tract atlas bundle
    # (hcp1065-tracts 1.1.0, in MNI152NLin2009aAsym) and to the space-transform bundle
    # xfm-nlin6asym-to-nlin2009aasym 1.0.0; both must be installed on the deployment
    # (docs/reference-data.md). The entry above stays for CI, which registers a synthetic tract
    # atlas in MNI152NLin6Asym (no transform).
    lnm-tracts-hcp1065:
      <<: *lnm_tracts
      title: lnm-tracts · HCP1065 tract atlas
  cognet-profile:
    cognet-stroke: &cognet_stroke
      title: COGNET-STROKE · registered concept maps
      step: {name: cognet-stroke, version: 1.1.0}
      kind: real
      licence_review:
        status: reviewed
        code: MIT
        weights: >-
          No model weights. The concept maps and null maps are a reference bundle (type
          concept-maps, derived from Neurosynth data, ODbL-1.0), installed locally and never in the
          image.
        image_redistribution: allowed
        notes: >-
          The image contains src/cdr.py of the COGNET-STROKE repository (compute_cdr and
          compute_overlap, copied unmodified) and its LICENSE. The repository had no licence file
          up to f98dbc8; its owner added the MIT licence in 64678b11 ("Add MIT License to the
          project", only the LICENSE file added on top of f98dbc8, src/cdr.py unchanged), which the
          wrapper pins. The consent of the co-author is taken as confirmed by the repository owner
          adding the licence. The wrapper itself is MIT. The 1.0.0 image predates the licence.
        reviewed: "2026-11-25"
        reviewed_by: project owner (licence added by the repository owner)
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data. No signed validation record exists, so it is not validated.
      image: docker.io/compneurobilbaolab/step-cognet-stroke@sha256:c6cf1186311ea65237d8235a95e9a02c314acba44e03f23844b472592cc88d42
      # Wrapper of this repository; it calls compute_cdr and compute_overlap of the author's
      # src/cdr.py, copied unmodified from the upstream commit (steps/cognet-stroke/upstream.env).
      source:
        repository: this
        dockerfile: steps/cognet-stroke/Dockerfile
        upstream: {repository: compneurobilbao/COGNET-STROKE, commit: 64678b11ccc3ceb28d68add68c36336fa5bd2124}
    # The same step image, pinned in pipeline.yaml to the COGNET-STROKE concept maps bundle
    # (cognet-concept-maps 1.0.0, installed on the deployment). The entry above stays for CI,
    # which registers synthetic concept maps.
    cognet-stroke-concept-maps:
      <<: *cognet_stroke
      title: COGNET-STROKE · concept maps
  report:
    research-report:
      step: {name: research-report, version: 0.4.0}
      kind: real
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data. No signed validation record exists, so it is not validated.
      image: docker.io/compneurobilbaolab/step-research-report@sha256:1f700ac224d4bd2e58a0c77201573bbe8d4ad7d6607cd6c271ae6be1796ff537
      source: {repository: this, dockerfile: steps/report/Dockerfile}
    research-report-es:
      step: {name: research-report, version: 0.4.0}
      kind: real
      validation:
        status: reference-tested
        notes: >-
          The step's reference test runs in CI on synthetic or public data. No signed validation record exists, so it is not validated.
      image: docker.io/compneurobilbaolab/step-research-report@sha256:1f700ac224d4bd2e58a0c77201573bbe8d4ad7d6607cd6c271ae6be1796ff537
      source: {repository: this, dockerfile: steps/report/Dockerfile}

# Stages that exist in the plan of the platform but cannot be used yet. The API lists them next to
# the slots (`GET /api/v1/pipelines/<id>/versions/<v>/in-development`) and the UI shows them greyed
# and labelled "In development", never selectable. An entry with `slot` is an existing slot of
# pipeline.yaml: it is shown only while the deployment has no enabled implementation for it
# (normalisation is enabled in the ci profile, so it is not listed there). An entry without `slot`
# is a stage that has no slot (no step yet): it needs `title`, and `description` is optional. Neither
# kind is a slot implementation, so no profile, seed or admin call can enable one.
in_development:
  - id: normalisation
    slot: normalisation
  - id: segmentation
    title: Lesion segmentation
    description: Delineate the lesion, including with external segmentation tools.
  - id: lesion-bank
    title: Lesion bank
    description: Capture and store lesions for later reuse.
  - id: voxel-lnm
    title: Voxel-wise structural LNM
    description: Runs on the HPC cluster. Its map is shown but not analysed further.

profiles:
  # What a deployment enables: the minimum pipeline for the lab. A lesion mask already in MNI152
  # space goes through intake and QC, functional disconnection with the HCP cohorts and the
  # COGNET-STROKE profile, tract-wise disconnection, and the report. Normalisation of CT lesions
  # stays enabled only in the ci profile: the slot is left unmounted here (CT-mode runs are
  # refused and the UI lists it as in development). Stubs and planned entries are never enabled
  # here. The functional disconnection entries need their normative-fc bundle (HCP Aging, HCP
  # Young Adult), the tract and COGNET entries their reference bundles (hcp1065-tracts with
  # xfm-nlin6asym-to-nlin2009aasym, cognet-concept-maps), installed locally
  # (docs/reference-data.md).
  deployment:
    enabled:
      lesion-intake: [lesion-qc]
      functional-disconnection: [flnm-fast-hcp-aging, flnm-fast-hcp-ya]
      tract-disconnection: [lnm-tracts-hcp1065]
      cognet-profile: [cognet-stroke-concept-maps]
      report: [research-report, research-report-es]
    default:
      lesion-intake: lesion-qc
      functional-disconnection: flnm-fast-hcp-aging
      tract-disconnection: lnm-tracts-hcp1065
      cognet-profile: cognet-stroke-concept-maps
      report: research-report
    # Presets (presets/<id>.yaml) offered to users: `enabled` ids seed `preset_settings`, `default`
    # is the preselected one (at most one). Only the minimum preset is enabled: `full` and
    # `lesion-qc-report` also accept the CT input set, `ct-normalisation` needs the normalisation
    # slot; the other analyses of this pipeline are not offered until that slot is mounted.
    presets:
      enabled: [mni-mask-analysis]
      default: mni-mask-analysis

  # The CI configuration: every slot that can run on fixtures is filled with the real step
  # where a light one exists. Functional disconnection enables both: the real flnm-fast step
  # pinned to the small synthetic normative-fc bundle (flnm-fast-synthetic, requested
  # explicitly by the end-to-end test; the HCP entries are not enabled because CI has no such
  # bundle) and the stub, which stays the default because the real-stack UI specs
  # (frontend/e2e/real) assert it. Normalisation runs the real CT step on a reference case
  # built in CI from a public head CT template (never committed), so CI runs both input sets.
  ci:
    enabled:
      lesion-intake: [lesion-qc]
      normalisation: [ct-lesion-to-mni152]
      functional-disconnection: [flnm-fast-synthetic, fdisconnection-stub]
      tract-disconnection: [lnm-tracts]
      cognet-profile: [cognet-stroke]
      report: [research-report, research-report-es]
    default:
      lesion-intake: lesion-qc
      normalisation: ct-lesion-to-mni152
      functional-disconnection: fdisconnection-stub
      tract-disconnection: lnm-tracts
      cognet-profile: cognet-stroke
      report: research-report
    # The implementation the end-to-end test picks in one slot to show that a
    # non-default choice runs.
    alternate: {slot: report, implementation: research-report-es}
    presets:
      enabled: [full, mni-mask-analysis, ct-normalisation, lesion-qc-report]
      default: full
