# stroke-lnm v0 (plan section 2.3) written with slots (D15). Contract: docs/contracts/pipeline.md.
#
# Image digests are those of the published images (docker.io/compneurobilbaolab/step-<name>,
# written by `registry.py pin` from the release run). In CI, `pipelines/stroke-lnm/registry.py
# materialize` replaces each of them with the digest of the locally built image of the step.
# registry.yaml in this directory holds the same entries plus which of them a deployment
# enables; `registry.py check` fails when the two files disagree.
contract_version: "1.0"
kind: Pipeline
id: stroke-lnm
version: 0.7.0
title: Lesion network mapping v0
description: >-
  Lesion intake and QC, normalisation of CT lesions to MNI152 (skipped when an MNI mask is
  supplied), functional and tract-wise disconnection, the COGNET-STROKE cognitive profile,
  and a research report. Version 0.2.0: tract disconnection is optional and the report does not
  need it, so a run without an enabled tract-disconnection implementation ends with a QC-only
  report (research-report 0.2.0 says that tract disconnection is not part of the analysis).
  Version 0.3.0: research-report 0.3.0 declares contract 1.2, so presets and custom plans that
  include the report run; the report states the plan, the external tools and the declared
  origins of supplied inputs.
  Version 0.4.0: the functional-disconnection slot pins flnm-fast 1.1.0, which declares contract 1.2
  and the `upstream` block of the external engine it wraps (first implementation with
  `origin: external` in the registry).
  Version 0.5.0: the functional-disconnection slot pins flnm-fast 2.0.0, which wraps engine 2.1.0
  (the lowest-numbered lesion-overlapped parcel is no longer left out of the weighting) with the
  same ports, parameters and bundle requirement.
  Version 0.6.0: the functional-disconnection slot pins flnm-fast 3.0.0, which has no parameters
  (no age or sex matching: the normative choice is the cohort only) and reads its parcellation
  from the bundle. The slot offers the same step image three times, each pinned to one
  normative-fc bundle through `bundles`: the HCP Aging cohort (default), the HCP Young Adult
  cohort, and a synthetic cohort for CI only.
  Version 0.7.0: the step images are the published ones (real digests). The tract-disconnection
  and cognet-profile slots each gain an entry of the same step image that pins the lab's reference
  bundle (`lnm-tracts-hcp1065` pins `hcp1065-tracts` 1.0.0, `cognet-stroke-concept-maps` pins
  `cognet-concept-maps` 1.0.0); the unpinned entries stay for CI, which registers synthetic
  bundles. Nothing else changes in the wiring.

inputs:
  - name: ct
    type: ct_native
  - name: lesion_native
    type: lesion_mask_native
  - name: lesion_mni
    type: lesion_mask_mni_any

input_sets:
  - name: ct-and-native-mask
    inputs: [ct, lesion_native]
    description: CT plus a lesion mask drawn on it.
  - name: mni-mask
    inputs: [lesion_mni]
    description: A lesion mask already in MNI space (mask-only mode).

slots:
  - name: lesion-intake
    title: Lesion intake and QC
    consumes:
      - {port: ct, type: ct_native, from: inputs.ct, optional: true}
      - {port: lesion_native, type: lesion_mask_native, from: inputs.lesion_native, optional: true}
      - {port: lesion_mni, type: lesion_mask_mni_any, from: inputs.lesion_mni, optional: true}
    produces:
      - {port: lesion_qc, type: lesion_qc}
      - port: lesion_mask_mni
        type: lesion_mask_mni
        when: {inputs_present: [lesion_mni]}
      - {port: qc_figure, type: qc_figure, optional: true}
    implementations:
      default: lesion-qc
      allowed:
        - id: lesion-qc
          step: {name: lesion-qc, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-lesion-qc@sha256:c23607186e6c771164ca6f0b8dcdd0509ec895344602cb60d9c4b0d841dcaf32

  - name: normalisation
    title: CT lesion to MNI152
    when: {inputs_present: [ct, lesion_native]}
    consumes:
      - {port: ct, type: ct_native, from: inputs.ct}
      - {port: lesion_mask, type: lesion_mask_native, from: inputs.lesion_native}
    produces:
      - {port: lesion_mask_mni, type: lesion_mask_mni}
      - {port: ct_mni, type: ct_mni, optional: true}
      - {port: qc_figure, type: qc_figure, optional: true}
    implementations:
      # The CT step of the CTLesion2MNI152 repository (registry.yaml pins the commit).
      # When a deployment leaves this slot unmounted, CT-mode runs are refused.
      default: ct-lesion-to-mni152
      allowed:
        - id: ct-lesion-to-mni152
          step: {name: ct-lesion-to-mni152, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-ct-lesion-to-mni152@sha256:a8242fcf9056ead332a298bb1aa3759f1c31985e3cb24b1c8bd65a9f4d44c057
          parameter_bindings:
            age_band: case.age_band

  - name: functional-disconnection
    title: Functional disconnection
    optional: true
    consumes:
      - port: lesion_mask
        type: lesion_mask_mni
        from: [normalisation.lesion_mask_mni, lesion-intake.lesion_mask_mni]
    produces:
      - {port: fdisconnection_map, type: fdisconnection_map}
    implementations:
      default: flnm-fast-hcp-aging
      allowed:
        # One step image, one entry per normative cohort: the pinned bundle is the whole
        # difference (the step has no parameters). The bundle must be installed on the
        # deployment (docs/reference-data.md); a run on a missing bundle is refused.
        # Normative cohort: HCP Aging (older adults), 1.0.0.
        - id: flnm-fast-hcp-aging
          step: {name: flnm-fast, version: 3.0.0}
          image: docker.io/compneurobilbaolab/step-flnm-fast@sha256:368df2c450b30f02d43d30bdf8ec9750bcf43f6b208731dde64d30bbf3c5efb0
          bundles:
            normative: {id: normative-fc-hcp-aging, version: 1.0.0}
        # Normative cohort: HCP Young Adult, 1.0.0.
        - id: flnm-fast-hcp-ya
          step: {name: flnm-fast, version: 3.0.0}
          image: docker.io/compneurobilbaolab/step-flnm-fast@sha256:368df2c450b30f02d43d30bdf8ec9750bcf43f6b208731dde64d30bbf3c5efb0
          bundles:
            normative: {id: normative-fc-hcp-ya, version: 1.0.0}
        # CI fixture: the real step on the small synthetic normative bundle. Only enabled in
        # the ci profile; its output has no scientific meaning.
        - id: flnm-fast-synthetic
          step: {name: flnm-fast, version: 3.0.0}
          image: docker.io/compneurobilbaolab/step-flnm-fast@sha256:368df2c450b30f02d43d30bdf8ec9750bcf43f6b208731dde64d30bbf3c5efb0
          bundles:
            normative: {id: synthetic-normative-fc, version: 1.0.0}
        # CI fixture and placeholder: synthetic output, only enabled in the ci profile.
        - id: fdisconnection-stub
          step: {name: fdisconnection-stub, version: 0.1.0}
          image: docker.io/compneurobilbaolab/step-fdisconnection-stub@sha256:8da4c433c7c9f6cf0dc9f59536d40f310fc8f09ff0d0c2dd28715a5e70c55745

  - name: tract-disconnection
    title: Tract-wise structural disconnection
    optional: true
    consumes:
      - port: lesion_mask
        type: lesion_mask_mni
        from: [normalisation.lesion_mask_mni, lesion-intake.lesion_mask_mni]
    produces:
      - {port: tract_disconnection, type: tract_disconnection}
    implementations:
      default: lnm-tracts
      allowed:
        - id: lnm-tracts
          step: {name: lnm-tracts, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-lnm-tracts@sha256:f80735a43d1ee90ea134ae2f3ff5fb1e304815e8861b97a4fed4a845b7f928ab
        # Same image, pinned to the HCP1065 tract atlas bundle: what the deployment profile
        # enables. The entry above takes whichever tract atlas is registered (CI registers a
        # synthetic one).
        - id: lnm-tracts-hcp1065
          step: {name: lnm-tracts, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-lnm-tracts@sha256:f80735a43d1ee90ea134ae2f3ff5fb1e304815e8861b97a4fed4a845b7f928ab
          bundles:
            tract_atlas: {id: hcp1065-tracts, version: 1.0.0}

  - name: cognet-profile
    title: COGNET-STROKE cognitive profile
    optional: true
    consumes:
      - port: lesion_mask
        type: lesion_mask_mni
        from: [normalisation.lesion_mask_mni, lesion-intake.lesion_mask_mni]
      - {port: fdisconnection_map, type: fdisconnection_map, from: functional-disconnection.fdisconnection_map}
    produces:
      - {port: profile, type: cognet_profile}
      - {port: profile_figure, type: qc_figure, optional: true}
    implementations:
      default: cognet-stroke
      allowed:
        - id: cognet-stroke
          step: {name: cognet-stroke, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-cognet-stroke@sha256:12bb50346f3d88dc3e6043e144c6735bcf647a34663a99464dc8397ecd5aa0a1
        # Same image, pinned to the COGNET-STROKE concept maps bundle: what the deployment
        # profile enables (the entry above is for CI, which registers synthetic concept maps).
        - id: cognet-stroke-concept-maps
          step: {name: cognet-stroke, version: 1.0.0}
          image: docker.io/compneurobilbaolab/step-cognet-stroke@sha256:12bb50346f3d88dc3e6043e144c6735bcf647a34663a99464dc8397ecd5aa0a1
          bundles:
            concept_maps: {id: cognet-concept-maps, version: 1.0.0}

  - name: report
    title: Research report
    consumes:
      - {port: lesion_qc, type: lesion_qc, from: lesion-intake.lesion_qc}
      - port: lesion_mask
        type: lesion_mask_mni
        from: [normalisation.lesion_mask_mni, lesion-intake.lesion_mask_mni]
      - {port: ct_mni, type: ct_mni, from: normalisation.ct_mni, optional: true}
      - {port: fdisconnection_map, type: fdisconnection_map, from: functional-disconnection.fdisconnection_map, optional: true}
      - {port: tract_disconnection, type: tract_disconnection, from: tract-disconnection.tract_disconnection, optional: true}
      - {port: cognet_profile, type: cognet_profile, from: cognet-profile.profile, optional: true}
      - {port: run_provenance, type: run_provenance, from: run.provenance}
    produces:
      - {port: report_pdf, type: report_pdf}
      - {port: report_json, type: report_json}
    implementations:
      default: research-report
      allowed:
        - id: research-report
          step: {name: research-report, version: 0.3.0}
          image: docker.io/compneurobilbaolab/step-research-report@sha256:fd3ece4683cd822d6c841a4efcbb2416a5e7b81123e3400e7d9a209784a0410b
        # Configured variant of the same image: the report text in Spanish.
        - id: research-report-es
          step: {name: research-report, version: 0.3.0}
          image: docker.io/compneurobilbaolab/step-research-report@sha256:fd3ece4683cd822d6c841a4efcbb2416a5e7b81123e3400e7d9a209784a0410b
          parameters:
            language: es
