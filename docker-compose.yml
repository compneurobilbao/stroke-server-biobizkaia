services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroimagen}
      POSTGRES_USER: ${POSTGRES_USER:-neuroimagen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroimagen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://neuroimagen:neuroimagen@postgres:5432/neuroimagen}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/studies}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-.nii,.nii.gz,.dcm,.zip,.tar,.tar.gz,.gz,.json,.txt}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1024}
      PROCESSOR_NAME: ${PROCESSOR_NAME:-dummy-development-processor}
      PROCESSOR_VERSION: ${PROCESSOR_VERSION:-0.1.0}
      PROCESSOR_BACKEND: ${PROCESSOR_BACKEND:-dummy}
      PROCESSOR_COMMAND: ${PROCESSOR_COMMAND:-python /app/external_processor/dummy_processor.py --input {input_dir} --output {output_dir} --study-id {study_id}}
      COMPNEURO_CONTAINER_IMAGE: ${COMPNEURO_CONTAINER_IMAGE:-compneurobilbaolab/compneuro-anatproc:1.1}
      COMPNEURO_PROJECT_MOUNT: ${COMPNEURO_PROJECT_MOUNT:-/project}
      COMPNEURO_COMMAND: ${COMPNEURO_COMMAND:-bash /app/src/apreproc_launcher.sh}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-0}
      MAX_CONCURRENT_PROCESSING_JOBS: ${MAX_CONCURRENT_PROCESSING_JOBS:-1}
      GENERATE_OUTPUT_ZIP: ${GENERATE_OUTPUT_ZIP:-true}
      GENERATE_TECHNICAL_PDF: ${GENERATE_TECHNICAL_PDF:-true}
      GENERATE_RENDERED_PNG: ${GENERATE_RENDERED_PNG:-true}
      NIFTI_RENDERER: ${NIFTI_RENDERER:-slicer}
      NIFTI_RENDER_MAX_FILES: ${NIFTI_RENDER_MAX_FILES:-50}
      NIFTI_RENDER_TIMEOUT_SECONDS: ${NIFTI_RENDER_TIMEOUT_SECONDS:-300}
      TECHNICAL_REPORT_FILENAME: ${TECHNICAL_REPORT_FILENAME:-technical_report.pdf}
      BIDS_VALIDATE: ${BIDS_VALIDATE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      SHARE_LINK_EXPIRE_HOURS: ${SHARE_LINK_EXPIRE_HOURS:-72}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.org}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      # Pipeline API (F0-30a). The directories default to paths that do not exist, so
      # without the `pipelines` profile /api/v1/pipelines is empty, exactly as before the
      # mounts below were added. A pipelines deployment sets API_PIPELINES_DIR=/app/pipelines
      # and API_STEP_MANIFESTS_DIR=/app/steps (docs/deployment.md). Bundles live under
      # ./data, which is already mounted; a missing directory means no bundles.
      PIPELINES_DIR: ${API_PIPELINES_DIR:-/app/pipelines-disabled}
      STEP_MANIFESTS_DIR: ${API_STEP_MANIFESTS_DIR:-/app/steps-disabled}
      BUNDLE_ROOT: ${BUNDLE_ROOT:-/app/data/bundles}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-research-public}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.0.0-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./data:/app/data
      # Read-only and inert unless API_PIPELINES_DIR / API_STEP_MANIFESTS_DIR point at them;
      # the seeding CLI also reads registry.yaml from here.
      - ./pipelines:/app/pipelines:ro
      - ./steps:/app/steps:ro
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: ${WORKER_DOCKERFILE:-backend/Dockerfile}
      args:
        COMPNEURO_ANATPROC_REF: ${COMPNEURO_ANATPROC_REF:-a2f3e7c9523ed521c3f85f7dffde5ee8fb400842}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://neuroimagen:neuroimagen@postgres:5432/neuroimagen}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/studies}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-.nii,.nii.gz,.dcm,.zip,.tar,.tar.gz,.gz,.json,.txt}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1024}
      PROCESSOR_NAME: ${PROCESSOR_NAME:-dummy-development-processor}
      PROCESSOR_VERSION: ${PROCESSOR_VERSION:-0.1.0}
      PROCESSOR_BACKEND: ${PROCESSOR_BACKEND:-dummy}
      PROCESSOR_COMMAND: ${PROCESSOR_COMMAND:-python /app/external_processor/dummy_processor.py --input {input_dir} --output {output_dir} --study-id {study_id}}
      COMPNEURO_CONTAINER_IMAGE: ${COMPNEURO_CONTAINER_IMAGE:-compneurobilbaolab/compneuro-anatproc:1.1}
      COMPNEURO_PROJECT_MOUNT: ${COMPNEURO_PROJECT_MOUNT:-/project}
      COMPNEURO_COMMAND: ${COMPNEURO_COMMAND:-bash /app/src/apreproc_launcher.sh}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-0}
      MAX_CONCURRENT_PROCESSING_JOBS: ${MAX_CONCURRENT_PROCESSING_JOBS:-1}
      GENERATE_OUTPUT_ZIP: ${GENERATE_OUTPUT_ZIP:-true}
      GENERATE_TECHNICAL_PDF: ${GENERATE_TECHNICAL_PDF:-true}
      GENERATE_RENDERED_PNG: ${GENERATE_RENDERED_PNG:-true}
      NIFTI_RENDERER: ${NIFTI_RENDERER:-slicer}
      NIFTI_RENDER_MAX_FILES: ${NIFTI_RENDER_MAX_FILES:-50}
      NIFTI_RENDER_TIMEOUT_SECONDS: ${NIFTI_RENDER_TIMEOUT_SECONDS:-300}
      TECHNICAL_REPORT_FILENAME: ${TECHNICAL_REPORT_FILENAME:-technical_report.pdf}
      BIDS_VALIDATE: ${BIDS_VALIDATE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@example.org}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./data:/app/data
    command: sh -c "celery -A worker.celery_app.celery_app worker --loglevel=INFO --concurrency=$${MAX_CONCURRENT_PROCESSING_JOBS:-1}"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api

  # ---- Pipeline runs (card F0-15a). Everything below is opt-in: without
  # `--profile pipelines` none of these services exists and the stack is exactly the
  # legacy one. Enable with `COMPOSE_PROFILES=pipelines` (works with `make up`) or
  # `docker compose --profile pipelines up -d`; see docs/deployment.md.

  # Orchestrator worker: consumes ONLY the `pipelines` queue (run_pipeline and
  # recover_pipeline_runs), so long pipeline runs never block legacy process_study
  # uploads handled by `worker` on the default queue. It is the only service allowed
  # to reach the docker-proxy: whoever controls it can create containers on the host.
  pipeline-worker:
    profiles: ["pipelines"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment: &pipeline-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://neuroimagen:neuroimagen@postgres:5432/neuroimagen}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/data/studies}
      PIPELINES_DIR: ${PIPELINES_DIR:-/app/pipelines}
      STEP_MANIFESTS_DIR: ${STEP_MANIFESTS_DIR:-/app/steps}
      BUNDLE_ROOT: ${BUNDLE_ROOT:-/app/data/bundles}
      ORCHESTRATOR_EXECUTOR: ${ORCHESTRATOR_EXECUTOR:-docker}
      ORCHESTRATOR_STEP_EXECUTORS: ${ORCHESTRATOR_STEP_EXECUTORS:-}
      ORCHESTRATOR_POLL_SECONDS: ${ORCHESTRATOR_POLL_SECONDS:-5}
      ORCHESTRATOR_MAX_ATTEMPTS: ${ORCHESTRATOR_MAX_ATTEMPTS:-2}
      ORCHESTRATOR_LEASE_SECONDS: ${ORCHESTRATOR_LEASE_SECONDS:-600}
      PLATFORM_VERSION: ${PLATFORM_VERSION:-0.0.0-dev}
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-http://docker-proxy:2375}
      DOCKER_EXECUTOR_HOST_PATH_MAP: ${DOCKER_EXECUTOR_HOST_PATH_MAP:-}
      DOCKER_EXECUTOR_USER: ${DOCKER_EXECUTOR_USER:-}
      DOCKER_EXECUTOR_PIDS_LIMIT: ${DOCKER_EXECUTOR_PIDS_LIMIT:-512}
      DOCKER_EXECUTOR_PULL_MISSING: ${DOCKER_EXECUTOR_PULL_MISSING:-false}
      DOCKER_EXECUTOR_ALLOW_GPUS: ${DOCKER_EXECUTOR_ALLOW_GPUS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./pipelines:/app/pipelines:ro
      - ./steps:/app/steps:ro
    networks:
      - default
      - executor-net
    command: sh -c "celery -A worker.celery_app.celery_app worker --loglevel=INFO -Q pipelines --hostname=pipelines@%h --concurrency=$${ORCHESTRATOR_WORKER_CONCURRENCY:-2}"
    restart: unless-stopped

  # Single instance only: periodic recover_pipeline_runs (routed to `pipelines`).
  # Never scale it; a second beat would enqueue every recovery twice.
  beat:
    profiles: ["pipelines"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment: *pipeline-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped

  # Restricted Docker API for the `docker` step executor (card F0-14, docs/deployment.md).
  # Off by default: start it with `docker compose --profile docker-executor up -d`, or
  # as part of the pipeline stack with `--profile pipelines` (see pipeline-worker).
  # Only the API sections needed to create, start, inspect, kill, log and remove
  # containers and to inspect images are enabled; exec, volumes, networks, build,
  # swarm, secrets and the rest answer 403. The proxy does not inspect request
  # bodies, so the executor builds every container spec itself. It listens on an
  # internal network only; never publish its port.
  docker-proxy:
    profiles: ["docker-executor", "pipelines"]
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459 # v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - executor-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # Internal: no route to the outside. Only docker-proxy and pipeline-worker join it.
  executor-net:
    internal: true

volumes:
  postgres-data:
  redis-data:
