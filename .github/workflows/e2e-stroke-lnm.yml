name: e2e stroke-lnm

# Card F0-33: the stroke-lnm v0 pipeline end to end on synthetic fixtures. The merged
# orchestrator runs the `ci` profile of pipelines/stroke-lnm/registry.yaml with the docker
# executor through the restricted socket proxy. The steps are built here (this repository's
# steps and the external ones at the commits pinned in registry.yaml), pushed to a throwaway
# registry to obtain image digests, and those digests are written into the pipeline at run time.

on:
  pull_request:
    paths:
      - "pipelines/**"
      - "steps/**"
      - "orchestrator/**"
      - "contracts/**"
      - "fixtures/**"
      - ".github/workflows/e2e-stroke-lnm.yml"
  push:
    branches: [develop, main]
    paths:
      - "pipelines/**"
      - "steps/**"
      - "orchestrator/**"
      - "contracts/**"
      - "fixtures/**"
      - ".github/workflows/e2e-stroke-lnm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-stroke-lnm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-stroke-lnm:
    name: e2e-stroke-lnm
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      # Keep in sync with the docker-proxy service in docker-compose.yml
      PROXY_IMAGE: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
      WORK: ${{ github.workspace }}/e2e-work
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt pytest==8.3.3
          pip install --no-deps -e steps/sdk

      - name: Registry and pipeline agree; committed pipeline is valid
        run: |
          python pipelines/stroke-lnm/registry.py check
          python contracts/validate.py --kind pipeline pipelines/stroke-lnm/pipeline.yaml
          python contracts/validate.py --kind step steps/stubs/fdisconnection-stub/step.yaml

      - name: Fetch the external steps at the pinned commits
        run: python pipelines/stroke-lnm/registry.py fetch --dest "$WORK/external"

      - name: Build the steps, push them to the throwaway registry, record digests
        run: |
          python pipelines/stroke-lnm/registry.py build \
            --external "$WORK/external" --prefix localhost:5000/ci \
            --digests-out "$WORK/digests.json" --manifests-out "$WORK/step-manifests"
          cat "$WORK/digests.json"

      - name: Write the digests into the pipeline and validate it with the manifests read from the images
        run: |
          python pipelines/stroke-lnm/registry.py materialize \
            --digests "$WORK/digests.json" --out "$WORK/pipelines"
          python contracts/validate.py "$WORK/pipelines/stroke-lnm/pipeline.yaml" "$WORK"/step-manifests/*/step.yaml
          # the manifests of this repository's steps in the images are the committed ones
          cmp "$WORK/step-manifests/lesion-qc-1.0.0/step.yaml" steps/lesion-qc/step.yaml
          cmp "$WORK/step-manifests/research-report-0.1.0/step.yaml" steps/report/step.yaml
          cmp "$WORK/step-manifests/fdisconnection-stub-0.1.0/step.yaml" steps/stubs/fdisconnection-stub/step.yaml

      - name: Reference data bundles (synthetic fixtures and the COGNET-STROKE synthetic concept maps)
        run: |
          mkdir -p "$WORK/bundles" "$WORK/cognet-ref"
          cp -r fixtures/data/bundles/toy-normative-connectome/1.0.0 "$WORK/bundles/toy-normative-connectome"
          cp -r fixtures/data/bundles/toy-tract-atlas/1.0.0 "$WORK/bundles/toy-tract-atlas"
          # generator of the pinned COGNET-STROKE step (fixed seed, nothing committed here)
          python "$WORK/external/COGNET-STROKE/step/tests/make_reference.py" "$WORK/cognet-ref" contracts
          cp -r "$WORK/cognet-ref/bundle" "$WORK/bundles/synthetic-concept-maps"

      - name: Start the restricted socket proxy
        run: |
          docker run -d --name docker-proxy -p 127.0.0.1:2375:2375 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e CONTAINERS=1 -e IMAGES=1 -e POST=1 -e DELETE=1 "$PROXY_IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:2375/_ping && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:2375/_ping

      - name: End-to-end runs (default implementations, non-default implementation, CT mode refused)
        env:
          STROKE_TEST_DOCKER_PROXY_URL: http://127.0.0.1:2375
          STROKE_LNM_PIPELINES_DIR: ${{ env.WORK }}/pipelines
          STROKE_LNM_STEP_MANIFESTS_DIR: ${{ env.WORK }}/step-manifests
          STROKE_LNM_BUNDLES_DIR: ${{ env.WORK }}/bundles
          STROKE_LNM_OUT_DIR: ${{ env.WORK }}/out
          STROKE_LNM_REQUIRE_E2E: "1"
        run: PYTHONPATH=.:backend pytest pipelines/stroke-lnm/tests -v -rs -p no:cacheprovider

      - name: Summary (pinned sources, image digests, run provenance)
        if: always()
        run: |
          {
            echo "### stroke-lnm end-to-end"
            echo
            echo "External steps are built from the commits pinned in pipelines/stroke-lnm/registry.yaml:"
            grep -n "commit:" pipelines/stroke-lnm/registry.yaml | sed 's/^/    /'
            echo
            echo "Image digests of this run (throwaway registry):"
            echo '```json'
            cat "$WORK/digests.json" 2>/dev/null || echo "not built"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Proxy log
        if: failure()
        run: docker logs docker-proxy

      - uses: actions/upload-artifact@v4.6.0
        if: always()
        with:
          name: e2e-stroke-lnm
          path: |
            ${{ env.WORK }}/out
            ${{ env.WORK }}/digests.json
            ${{ env.WORK }}/pipelines
          if-no-files-found: warn
