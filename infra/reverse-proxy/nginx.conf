# Sign-in rate limit per client address (http context: this file is included inside http {}).
# 10 requests per minute with a burst of 5 is far above what a person needs and slows
# password guessing; the API adds failure limits per account on top (docs/security.md).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 1024m;
    server_tokens off;

    # Security headers for every response, errors included. No location below may use
    # add_header: nginx would then drop all of these for that location.
    # The CSP is also served by `vite preview` in the mocked Playwright job, which fails on
    # any violation (frontend/playwright.config.ts reads it from this file).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Every location sets X-Forwarded-For to the address nginx sees (never appends what the
    # client sent): the API trusts that header from the Compose network and audits it. Behind
    # another TLS proxy, configure real_ip here so $remote_addr is the client's address.

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        # Same JSON shape as the API's own 429, so the frontend shows one message.
        error_page 429 = @login_throttled;
        proxy_pass http://api:8000/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_throttled {
        default_type application/json;
        return 429 '{"detail": "Too many sign-in attempts; try again later", "code": "too_many_login_attempts"}';
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
