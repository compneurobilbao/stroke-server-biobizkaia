# Manifest of the template step (contract 1.0). Copy this directory to start a new step
# and edit every field; see steps/README.md. Validate with:
#   python contracts/validate.py --kind step steps/<name>/step.yaml
contract_version: "1.0"
kind: Step
name: template-lesion-volume
version: 1.0.0
title: Lesion volume (template step)
description: >-
  Measures the volume of a binary lesion mask on the MNI152 working grid and writes
  the measurement as JSON. A deliberately trivial step that exercises every part of
  the step contract: input validation, parameters, warnings, declared errors and
  provenance. It is meant to be copied, not deployed in a pipeline.
provides: lesion-volume
image:
  repository: docker.io/example/template-lesion-volume-step
licence:
  spdx: MIT
  third_party:
    - {name: nibabel, version: 5.3.2, spdx: MIT}
    - {name: numpy, version: 2.2.6, spdx: BSD-3-Clause}

inputs:
  - name: lesion_mask
    type: lesion_mask_mni
    description: Binary lesion mask on the 2 mm MNI152 working grid.

outputs:
  - name: lesion_qc
    type: lesion_qc
    description: JSON with the lesion volume and voxel count.

parameters:
  type: object
  additionalProperties: false
  properties:
    warn_below_ml:
      description: A warning is recorded when the lesion volume is below this value (ml).
      type: number
      minimum: 0
      default: 1.0
    max_volume_ml:
      description: The QC check fails when the lesion volume exceeds this value (ml).
      type: number
      exclusiveMinimum: 0
      default: 1500.0

resources:
  cpus: 1
  memory_mb: 512
  wall_time_minutes: 5
  scratch_mb: 64

errors:
  # The first three codes are raised by the SDK itself; every step must declare them.
  - code: input_missing
    category: input_rejected
    description: A required input was not provided.
  - code: input_format_invalid
    category: input_rejected
    description: An input file does not satisfy its artefact type (format, grid, binary values).
  - code: invalid_parameters
    category: input_rejected
    description: The parameters do not satisfy the step's parameter schema.
  - code: mask_empty
    category: input_rejected
    description: The lesion mask has no voxels set.
  - code: lesion_too_large
    category: qc_failed
    description: The lesion volume exceeds the configured maximum.

reference_test:
  description: >-
    A synthetic spherical mask generated by tests/make_reference.py (no fixture files are
    committed); the expected measurement is computed independently from the voxel count.
  inputs:
    lesion_mask: tests/reference/lesion_mask.nii.gz
  expected:
    lesion_qc:
      compare: json
      file: tests/reference/expected/lesion_qc.json
      rtol: 0.000001
      atol: 0
