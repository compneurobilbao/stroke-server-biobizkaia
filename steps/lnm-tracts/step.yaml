# Step manifest (contract 1.0) of the tract-wise structural disconnection step.
# Validate with contracts/validate.py --kind step.
contract_version: "1.0"
kind: Step
name: lnm-tracts
version: 1.1.0
title: Tract-wise structural disconnection
description: >-
  For every tract of a tract atlas bundle, removes the streamlines that pass through the
  lesion (MRtrix3 tckedit -exclude, as in the src/lnm_tracts.sh script of the lnm
  repository) and reports the fraction removed, with the streamline counts. Per-case and
  read-only on the atlas: all scratch is in /tmp. Voxel-wise structural disconnection is a
  different step. Version 1.0.1 is built from the platform repository (steps/lnm-tracts); the
  image contains no code of the lnm repository, whose script at the commit in upstream.env is
  used by CI for comparison only. Since 1.1.0: when the atlas declares a space
  (metadata.space) other than the lesion's (MNI152NLin6Asym), the lesion is first resampled
  into the atlas space by nearest neighbour with a space-transform bundle; an atlas without
  metadata.space is taken to be in MNI152NLin6Asym and gives the results of 1.0.x.
provides: tract-disconnection
image:
  repository: docker.io/compneurobilbaolab/step-lnm-tracts
source_url: https://github.com/compneurobilbao/stroke-server-biobizkaia
licence:
  spdx: MIT
  third_party:
    # MRtrix3 tckedit and tckstats are compiled from the pinned release source in the image.
    - {name: MRtrix3, version: 3.0.4, spdx: MPL-2.0}
    - {name: nibabel, version: 5.3.2, spdx: MIT}
    - {name: numpy, version: 2.2.6, spdx: BSD-3-Clause}

inputs:
  - name: lesion_mask
    type: lesion_mask_mni
    description: Binary lesion mask on the 2 mm MNI152NLin6Asym working grid.

outputs:
  - name: tract_disconnection
    type: tract_disconnection
    description: >-
      One row per tract, in the order of the atlas. Columns tract, disconnection (fraction of
      the tract's streamlines that pass through the lesion; equals 1 minus the Disc column of
      lnm_tracts.sh, up to that script's three-digit truncation), n_streamlines, n_disconnected.

parameters:
  type: object
  additionalProperties: false
  properties: {}

bundles:
  - name: tract_atlas
    type: tract-atlas
    description: >-
      Tract atlas as streamline files in the millimetre coordinates of the space named by
      metadata.space of its bundle.yaml (MNI152NLin6Asym when absent). Layout: labels.txt
      (one tract name per line, [A-Za-z0-9_.+-], at most 64 characters, unique) and one
      <tract name>.tck per name, all at the bundle root (the layout of the former yeh_tracts
      directory). Every tract needs at least one streamline.
  - name: space_transform
    type: space-transform
    required: false
    description: >-
      Needed only when the atlas space differs from MNI152NLin6Asym, and then required by the
      step (internal failure space_transform_missing without it). metadata.from_space must be
      MNI152NLin6Asym and metadata.to_space the atlas space (else space_transform_mismatch).
      Layout: coordinate_map.nii.gz, a float image of shape (X, Y, Z, 3) on a grid of the atlas
      space whose voxels hold the RAS millimetre position in MNI152NLin6Asym of their centre
      (the image-resampling direction). The lesion is resampled onto that grid by nearest
      neighbour; voxel counts and volumes before and after are recorded in the provenance
      warning lesion_resampled_to_atlas_space and in extra/atlas_space_resampling.json, with
      the resampled mask in extra/lesion_mask_atlas_space.nii.gz. Ignored when the atlas is in
      MNI152NLin6Asym.

resources:
  cpus: 2
  memory_mb: 2048
  wall_time_minutes: 60
  scratch_mb: 2048

errors:
  - code: input_missing
    category: input_rejected
    description: The lesion mask was not provided.
  - code: input_format_invalid
    category: input_rejected
    description: The lesion mask does not satisfy its artefact type (format, grid, binary values).
  - code: invalid_parameters
    category: input_rejected
    description: The parameters do not satisfy the step's parameter schema.
  - code: mask_empty
    category: input_rejected
    description: The lesion mask has no voxels set.
  - code: mask_outside_atlas_space
    category: input_rejected
    description: >-
      The lesion mask has no voxel left after resampling into the atlas space (it lies outside
      the grid of the space-transform bundle).

reference_test:
  description: >-
    A synthetic tract atlas (five curved streamline bundles of 60 streamlines in MNI millimetre
    coordinates) and a synthetic spherical lesion, both generated by tests/make_reference.py
    (nothing is committed). The expected table is computed independently in numpy: a streamline
    is disconnected when one of its vertices falls in a lesion voxel. CI also runs the former
    lnm_tracts.sh on the same input and compares it with 1 - Disc.
  inputs:
    lesion_mask: tests/reference/lesion_mask.nii.gz
  bundles:
    tract_atlas: {id: toy-lnm-tract-atlas, version: 1.0.0}
  expected:
    tract_disconnection:
      compare: allclose
      file: tests/reference/expected/tract_disconnection.tsv
      rtol: 0
      atol: 0.000001
