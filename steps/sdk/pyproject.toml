[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compneuro-step-sdk"
version = "1.0.0"
description = "Step side of the step contract 1.0: argument parsing, validation, provenance, error reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "nibabel>=5.2",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stroke-step-reftest = "stroke_step_sdk.reftest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
