contract_version: "1.2"
kind: Step
name: flnm-fast
version: 3.0.0
title: Functional lesion network mapping (flnm-fast)
description: >-
  Functional lesion network z-map of one lesion. The packaged engine (image
  compneurobilbaolab/flnm-fast 2.1.0, unchanged) weights the parcels of the normative
  parcellation by their overlap with the lesion mask, computes the lesion-weighted functional
  connectivity profile of every participant of the mounted normative cohort, tests every
  target parcel against zero across all of those participants with a one-sample t-test,
  converts the signed t statistics to signed z scores and writes them on the working grid,
  piecewise constant per parcel. The normative functional connectivity data is a reference
  bundle of type normative-fc (docs/reference-data.md); the bundle is the normative choice
  (one bundle per cohort, selected by the pipeline's implementation entry) and the step uses
  every participant of it: there is no age or sex matching, so the step has no parameters and
  the case's sex and age are not used. The parcellation is read from the bundle. Values are
  signed z scores of lesion-to-parcel connectivity: positive where a parcel is positively
  coupled with the lesion site. Version 3.0.0 removes the parameters sex, age_band and
  control_count and the rejections participant_sex_missing, participant_age_missing and
  insufficient_controls (major change), and takes the parcellation path from the bundle
  instead of a fixed file name. It wraps engine 2.1.0 as 2.0.0 did.
provides: functional-disconnection
image:
  repository: docker.io/compneurobilbaolab/step-flnm-fast
upstream:
  name: flnm-fast (lesion_zmaps engine)
  version: "2.1.0"
  homepage: https://hub.docker.com/r/compneurobilbaolab/flnm-fast
  image: docker.io/compneurobilbaolab/flnm-fast@sha256:eb3f88383d1594fa4ca8ec3c2b1c4207a13b8a46b391cf8c12d3cda196f40d9b
  licence: MIT
  citation: >-
    flnm-fast lesion_zmaps engine 2.1.0 (Docker image compneurobilbaolab/flnm-fast; no
    publication; cite the image and its digest)
licence:
  spdx: MIT
  third_party:
    - {name: flnm-fast (lesion_zmaps engine), version: "2.1.0", spdx: MIT}
    - {name: nibabel, version: 5.3.1, spdx: MIT}
    - {name: numpy, version: 2.1.2, spdx: BSD-3-Clause}
    - {name: pandas, version: 2.2.3, spdx: BSD-3-Clause}
    - {name: scipy, version: 1.14.1, spdx: BSD-3-Clause}
    - {name: Python, version: 3.12.16, spdx: PSF-2.0}

inputs:
  - name: lesion_mask
    type: lesion_mask_mni
    required: true
    description: Binary lesion mask on the 2 mm MNI152NLin6Asym working grid.

outputs:
  - name: fdisconnection_map
    type: fdisconnection_map
    required: true
    description: >-
      Signed z score of every parcel of the normative parcellation, written on the
      parcels' voxels of the working grid (zero outside the parcellation, NaN for a parcel
      whose statistic is undefined).

parameters:
  type: object
  additionalProperties: false
  properties: {}

bundles:
  - name: normative
    type: normative-fc
    version: ">=1.0.0, <2.0.0"
    description: >-
      Normative parcel-by-parcel functional connectivity of a healthy cohort (layout in
      steps/flnm-fast/README.md; age and sex are not needed). The pipeline's implementation
      entry pins which cohort bundle is used. Licence terms of the cohort apply: real data is
      not redistributable and is installed locally.

resources:
  cpus: 1
  memory_mb: 4096
  wall_time_minutes: 30
  scratch_mb: 256

errors:
  - code: mask_empty
    category: input_rejected
    description: The lesion mask has no voxels set.
  - code: lesion_outside_parcellation
    category: input_rejected
    description: The lesion does not overlap any parcel of the normative parcellation.

reference_test:
  description: >-
    A synthetic normative cohort (27 block parcels, 200 participants, seeded hash-based
    connectivity, no age or sex columns) and a synthetic ball lesion straddling several
    parcels, all written by tests/make_reference.py (nothing is committed). The expected z-map
    is computed independently of the engine with the standard library (exact t distribution
    and normal quantile functions) and numpy, over every participant. Run with the generated
    bundle as --bundle normative=steps/flnm-fast/tests/reference/bundle.
  generator: tests/make_reference.py
  inputs:
    lesion_mask: tests/reference/lesion_mask.nii.gz
  bundles:
    normative: {id: synthetic-normative-fc, version: 1.0.0}
  parameters: {}
  expected:
    fdisconnection_map:
      compare: allclose
      file: tests/reference/expected/fdisconnection_map.nii.gz
      rtol: 0.00001
      atol: 0.00001
