contract_version: "1.0"
kind: Step
name: research-report
version: 0.1.0
title: Research report
description: >-
  Builds the research report of a run from the artefacts and JSON outputs of the previous
  steps: lesion QC and mask on the 2 mm MNI152NLin6Asym grid, the optional functional
  disconnection map, the optional tract disconnection table, the optional COGNET profile and
  the run provenance. Writes a PDF (English or Spanish, chosen by the language parameter)
  and report.json, the canonical machine-readable content of the report (sorted keys,
  fixed-notation numbers, no timestamps or software versions; the basis for later sealing).
  Every PDF page carries the research-use-only banner, and the PDF ends with a provenance
  table with the image digest of every step of the run. An absent optional input is not an
  error: the section says so. The figures use nilearn on its bundled MNI152 template (or on
  the optional ct_mni image when it is provided).
provides: report
image:
  repository: docker.io/example/research-report-step
licence:
  spdx: MIT
  third_party:
    - {name: WeasyPrint, version: "62.3", spdx: BSD-3-Clause}
    - {name: Jinja2, version: 3.1.4, spdx: BSD-3-Clause}
    - {name: nilearn, version: 0.11.1, spdx: BSD-3-Clause}
    - {name: nibabel, version: 5.3.2, spdx: MIT}
    - {name: numpy, version: 2.2.6, spdx: BSD-3-Clause}
    - {name: matplotlib, version: 3.9.2, spdx: LicenseRef-Matplotlib}
    - {name: DejaVu fonts, version: "2.37", spdx: LicenseRef-DejaVu-fonts}

inputs:
  - name: lesion_qc
    type: lesion_qc
    required: true
    description: Lesion QC JSON of the lesion intake step.
  - name: lesion_mask
    type: lesion_mask_mni
    required: true
    description: Binary lesion mask on the 2 mm MNI152NLin6Asym working grid.
  - name: run_provenance
    type: run_provenance
    required: true
    description: Run provenance as it stands when the report is staged.
  - name: ct_mni
    type: ct_mni
    required: false
    description: CT in MNI152 space; background of the figures when present.
  - name: fdisconnection_map
    type: fdisconnection_map
    required: false
    description: Functional disconnection map; section reports absence when missing.
  - name: tract_disconnection
    type: tract_disconnection
    required: false
    description: Tract disconnection table (tract, disconnection); section reports absence when missing.
  - name: cognet_profile
    type: cognet_profile
    required: false
    description: COGNET cognitive profile; section reports absence when missing.

outputs:
  - name: report_pdf
    type: report_pdf
    description: Human-readable report, research-use banner on every page.
  - name: report_json
    type: report_json
    description: Canonical JSON content of the report (schema in report.schema.json).

parameters:
  type: object
  additionalProperties: false
  properties:
    language:
      description: Language of the PDF (English or Spanish). report.json is language-neutral.
      type: string
      enum: [en, es]
      default: en

resources:
  cpus: 1
  memory_mb: 2048
  wall_time_minutes: 15
  scratch_mb: 256

errors:
  - code: input_missing
    category: input_rejected
    description: A required input was not provided.
  - code: input_format_invalid
    category: input_rejected
    description: An input is not valid for its type or its content is unusable (for example a tract table value outside [0, 1], or a cognitive profile that violates its schema).
  - code: invalid_parameters
    category: input_rejected
    description: The parameters do not satisfy the parameter schema of the step.

reference_test:
  description: >-
    Synthetic inputs generated by tests/make_reference.py (not committed): a mask from
    fixtures/data/mni_masks, the lesion_qc JSON produced by the lesion-qc step from it, a
    synthetic tract table, a synthetic functional disconnection map, a synthetic COGNET profile
    and the example run provenance. report.json must equal the committed golden file byte for byte.
  inputs:
    lesion_qc: tests/reference/lesion_qc.json
    lesion_mask: tests/reference/lesion_mask.nii.gz
    run_provenance: tests/reference/run_provenance.json
    fdisconnection_map: tests/reference/fdisconnection_map.nii.gz
    tract_disconnection: tests/reference/tract_disconnection.tsv
    cognet_profile: tests/reference/cognet_profile.json
  parameters:
    language: en
  expected:
    report_json:
      compare: sha256
      file: tests/golden/report_full_en.json
    report_pdf:
      compare: exists
